name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shop-assistant .
      - name: Smoke test in demo mode
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=1 shop-assistant
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/chat -H 'Content-Type: application/json' \
            -d '{"message": "waterproof jacket"}' | grep -q '"type": "products"'
          docker logs app
