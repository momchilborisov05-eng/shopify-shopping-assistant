name: CI

on:
  push:
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # A scripted Claude and a fake Shopify API: the tests never call either and cost nothing.
      - run: pytest -q --cov --cov-report=term --cov-fail-under=80

  benchmark:
    name: Benchmark smoke run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The eval catalogue is reproducible from its seed
        run: python scripts/build_eval_catalog.py && git diff --exit-code data/eval_catalog.json eval/search_queries.json
      - run: python scripts/benchmark.py --quick --out bench-out
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench-out/

  image:
    name: Docker build, smoke test, push
    runs-on: ubuntu-latest
    needs: [test, benchmark]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shop-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id shop-assistant:ci -un)" = "app"
      - name: Start the container in demo mode (read-only root) and ask a question
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=1 --read-only --tmpfs /tmp \
            -v assistant-data:/app/var shop-assistant:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/readyz
          curl -sf -X POST localhost:8000/api/chat -H 'Content-Type: application/json' \
            -d '{"message": "waterproof jacket"}' | grep -q '"type": "products"'
      - name: Show container logs
        if: always()
        run: docker logs app
      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag shop-assistant:ci "$image:${{ github.sha }}"
          docker tag shop-assistant:ci "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: image
    # Runs only once the Azure connection is configured (README, "Deploy to Azure").
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CONTAINER_APP != ''
    environment: production
    permissions:
      id-token: write   # OpenID Connect sign-in to Azure, no stored password
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          az containerapp update --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --image "$image:${{ github.sha }}"
      - name: Wait until the new revision is ready
        run: |
          url=$(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do curl -fsS "https://$url/readyz" && exit 0; sleep 10; done
          exit 1
